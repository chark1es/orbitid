[package]
name = "orbitid-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "orbitid"
path = "src/main.rs"

[dependencies]
orbitid-core = { path = "../orbitid-core" }
orbitid-platform = { path = "../orbitid-platform" }
orbitid-credentials = { path = "../orbitid-credentials" }
orbitid-federation = { path = "../orbitid-federation" }
orbitid-identity = { path = "../orbitid-identity" }
orbitid-fapi-auth = { path = "../orbitid-fapi-auth" }
orbitid-fapi-account = { path = "../orbitid-fapi-account" }
orbitid-bapi = { path = "../orbitid-bapi" }
orbitid-oidc = { path = "../orbitid-oidc" }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
bytes = { workspace = true }
sqlx = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
percent-encoding = { workspace = true }
url = { workspace = true }

[dev-dependencies]
orbitid-core = { path = "../orbitid-core", features = ["test-util"] }
orbitid-identity = { path = "../orbitid-identity", features = ["test-util"] }
orbitid-credentials = { path = "../orbitid-credentials", features = ["test-util"] }
async-trait = { workspace = true }
http-body-util = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
