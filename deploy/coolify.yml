# OrbitID for Coolify, as a "Docker Compose" resource: paste this file into a "Docker Compose Empty"
# resource, or point a Git-based Docker Compose resource at /deploy/coolify.yml. It pulls the prebuilt image
# from GitHub Container Registry; nothing is built.
#
# Coolify fills in the magic variables below on the first deploy and keeps them across redeploys
# (https://coolify.io/docs/knowledge-base/docker/compose):
#   SERVICE_URL_ORBITID_4000          public URL with scheme; the proxy routes it to container port 4000
#   SERVICE_PASSWORD_64_POSTGRES      64-character alphanumeric Postgres password
#   SERVICE_BASE64_64_ENCRYPTIONKEY   64 random alphanumeric characters (not Base64-encoded despite the name)
#
# Back up SERVICE_BASE64_64_ENCRYPTIONKEY from Coolify's Environment Variables page and never change it: a
# restore with a different key cannot read the stored signing keys. Set your domain on the orbitid service as `https://auth.example.com:4000`
# (the :4000 is the container port; browsers still use 443) and redeploy so ORBITID_BASE_URL follows it.
#
# The server runs as the unprivileged `orbitid` user with a read-only root filesystem, no Linux capabilities
# and a small writable /tmp. No port is published: Coolify's proxy is the only way in, so the server trusts
# exactly one proxy hop for the client address and scheme.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbitid
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: orbitid
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitid -d orbitid"]
      interval: 5s
      timeout: 3s
      retries: 10

  orbitid:
    # `latest` follows every release; set ORBITID_VERSION to `1`, `1.2` or `1.2.3` to pin.
    image: ghcr.io/chark1es/orbitid:${ORBITID_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Required: deploying before the domain is set would start a server with an empty token issuer.
      ORBITID_BASE_URL: ${SERVICE_URL_ORBITID_4000:?Set the orbitid service domain, e.g. https://auth.example.com:4000, then deploy}
      ORBITID_DATABASE_HOST: postgres
      ORBITID_DATABASE_PORT: "5432"
      ORBITID_DATABASE_USER: orbitid
      ORBITID_DATABASE_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      ORBITID_DATABASE_NAME: orbitid
      ORBITID_ENCRYPTION_KEY: ${SERVICE_BASE64_64_ENCRYPTIONKEY}
      ORBITID_SECRET_KEY: ${ORBITID_SECRET_KEY:-}
      # Coolify's proxy replaces client-supplied X-Forwarded-* headers. Raise this to 2 only when another
      # proxy you control (a CDN, a load balancer) sits in front of Coolify's.
      ORBITID_TRUST_PROXY: ${ORBITID_TRUST_PROXY:-1}
      ORBITID_DB_MAX_CONNECTIONS: ${ORBITID_DB_MAX_CONNECTIONS:-20}
      ORBITID_DB_ACQUIRE_TIMEOUT_MS: ${ORBITID_DB_ACQUIRE_TIMEOUT_MS:-30000}
      ORBITID_RESEND_API_KEY: ${ORBITID_RESEND_API_KEY:-}
      ORBITID_SMTP_URL: ${ORBITID_SMTP_URL:-}
      ORBITID_EMAIL_FROM: ${ORBITID_EMAIL_FROM:-}
      # Release check against GitHub every 6 hours (no instance data sent); false makes no request.
      ORBITID_UPDATE_CHECK: ${ORBITID_UPDATE_CHECK:-true}
    healthcheck:
      test: ["CMD", "/usr/local/bin/orbitid", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  postgres-data:
