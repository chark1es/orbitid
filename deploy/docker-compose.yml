# OrbitID with Postgres, from the prebuilt image on GitHub Container Registry. Nothing is built here.
#
#   curl -fsSL https://raw.githubusercontent.com/chark1es/orbitid/main/scripts/install.sh | sh
#
# does everything below for you. By hand: put this file in an empty directory, create a .env next to it with
#
#   POSTGRES_PASSWORD=<openssl rand -hex 32>
#   ORBITID_ENCRYPTION_KEY=<openssl rand -base64 32>
#
# then `docker compose up -d`. Upgrade with `docker compose pull && docker compose up -d`.
# The repository root's docker-compose.yml is the development variant that builds the checkout instead.
#
# The server container is hardened: it runs as the unprivileged `orbitid` user (uid 10001) from the image,
# with a read-only root filesystem, no Linux capabilities and a small writable /tmp. There is no data volume:
# users, settings, signing keys and uploads all live in Postgres.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbitid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: orbitid
    # Total connections = replicas x (ORBITID_DB_MAX_CONNECTIONS + 1 settings listener).
    command: ["postgres", "-c", "max_connections=300"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitid -d orbitid"]
      interval: 5s
      timeout: 3s
      retries: 10

  orbitid:
    # `latest` follows every release. Pin a major (`1`), minor (`1.2`) or exact (`1.2.3`) tag in .env to
    # control when upgrades happen.
    image: ghcr.io/chark1es/orbitid:${ORBITID_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Separate parts, never a URL, so any password works without URL-encoding.
      ORBITID_DATABASE_HOST: postgres
      ORBITID_DATABASE_PORT: "5432"
      ORBITID_DATABASE_USER: orbitid
      ORBITID_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      ORBITID_DATABASE_NAME: orbitid
      # The URL browsers and your apps use. Set it to the public https:// address when a proxy or a
      # hostname reaches this instance; it is the token issuer.
      ORBITID_BASE_URL: ${ORBITID_BASE_URL:-http://localhost:${ORBITID_PORT:-4000}}
      ORBITID_ENCRYPTION_KEY: ${ORBITID_ENCRYPTION_KEY:?Set ORBITID_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      ORBITID_SECRET_KEY: ${ORBITID_SECRET_KEY:-}
      # 1 behind one reverse proxy you run; 0 when clients reach the published port directly.
      ORBITID_TRUST_PROXY: ${ORBITID_TRUST_PROXY:-0}
      ORBITID_DB_MAX_CONNECTIONS: ${ORBITID_DB_MAX_CONNECTIONS:-20}
      ORBITID_DB_ACQUIRE_TIMEOUT_MS: ${ORBITID_DB_ACQUIRE_TIMEOUT_MS:-30000}
      ORBITID_RESEND_API_KEY: ${ORBITID_RESEND_API_KEY:-}
      ORBITID_SMTP_URL: ${ORBITID_SMTP_URL:-}
      ORBITID_EMAIL_FROM: ${ORBITID_EMAIL_FROM:-}
    ports:
      # Local only by default: the first visitor of a fresh instance creates the owner account, so nothing
      # outside this host should reach it before you have. Put a reverse proxy in front, or set
      # ORBITID_BIND=0.0.0.0 to publish the port on every interface.
      - "${ORBITID_BIND:-127.0.0.1}:${ORBITID_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/orbitid", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  postgres-data:
