name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Native sqlite binding loads on Node
        run: node -e "require('better-sqlite3')"
      - run: bun run test:maintenance
      - run: bun run check:files
      - run: bun run check:docs
      - run: bun run typecheck
      - run: bun run test
      - name: Committed OpenAPI document is current
        run: bun run --filter @orbitid/server openapi:export && git diff --exit-code docs/openapi.json
      - name: Dashboard build
        run: bun run --filter @orbitid/dashboard build
      - name: Example app build
        run: bun run --filter example-next build
        env:
          NEXT_PUBLIC_ORBITID_PUBLISHABLE_KEY: pk_test_aHR0cDovL2xvY2FsaG9zdDo0MDAw
          ORBITID_SECRET_KEY: sk_test_ci

  # Proves the documented deployment works: the image builds, runs unprivileged on SQLite, and the compose
  # file brings up Postgres. scripts/smoke-container.sh is the same check an operator can run locally.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Docker versions
        run: docker version && docker compose version
      - name: Container smoke test
        run: bash scripts/smoke-container.sh
      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a
          docker compose ls -a || true
          for id in $(docker ps -aq); do echo "=== $id ==="; docker logs --tail 200 "$id" || true; done
