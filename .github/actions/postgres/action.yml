name: Postgres
description: >
  Postgres 17 on localhost:5432 (user and password `orbit`) tuned for tests. GitHub `services:`
  cannot pass server flags, so it is started by hand: durability is off and connections are
  plentiful because every test makes its own database.

runs:
  using: composite
  steps:
    - name: Start Postgres
      shell: bash
      run: |
        docker run -d --name pg -p 5432:5432 \
          -e POSTGRES_USER=orbit -e POSTGRES_PASSWORD=orbit -e POSTGRES_DB=postgres \
          postgres:17-alpine \
          -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
          -c max_connections=1000 -c shared_buffers=256MB
    - name: Wait for Postgres
      shell: bash
      run: |
        for i in $(seq 1 30); do
          if docker exec pg pg_isready -U orbit -d postgres; then exit 0; fi
          sleep 2
        done
        echo "Postgres did not become ready within 60 seconds" >&2
        docker logs pg || true
        exit 1
