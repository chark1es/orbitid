# OrbitID with Postgres. Copy .env.example to .env, set ORBITID_ENCRYPTION_KEY, then: docker compose up -d
#
# The server container is hardened: it runs as the unprivileged `node` user from the image, with a read-only
# root filesystem, no Linux capabilities it does not need, and a small writable /tmp. Only the data volume is
# writable, and `ORBITID_DATA_DIR` points into it.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbitid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbitid}
      POSTGRES_DB: orbitid
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitid -d orbitid"]
      interval: 5s
      timeout: 3s
      retries: 10

  orbitid:
    build: .
    # Tag compose builds this checkout as. The smoke test sets it per run so parallel runs stay isolated.
    image: ${ORBITID_IMAGE:-orbitid:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORBITID_DATABASE_URL: postgres://orbitid:${POSTGRES_PASSWORD:-orbitid}@postgres:5432/orbitid
      # The port below is published on the host, so the default public URL follows it. Set ORBITID_BASE_URL
      # explicitly when a proxy or a public hostname reaches this instance, or redirects and tokens point here.
      ORBITID_BASE_URL: ${ORBITID_BASE_URL:-http://localhost:${ORBITID_PORT:-4000}}
      ORBITID_ENCRYPTION_KEY: ${ORBITID_ENCRYPTION_KEY:?Set ORBITID_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      ORBITID_SECRET_KEY: ${ORBITID_SECRET_KEY:-}
      ORBITID_TRUST_PROXY: ${ORBITID_TRUST_PROXY:-0}
      ORBITID_RESEND_API_KEY: ${ORBITID_RESEND_API_KEY:-}
      ORBITID_SMTP_URL: ${ORBITID_SMTP_URL:-}
      ORBITID_EMAIL_FROM: ${ORBITID_EMAIL_FROM:-}
      ORBITID_ALLOW_CONSOLE_EMAIL: ${ORBITID_ALLOW_CONSOLE_EMAIL:-false}
    ports:
      - "${ORBITID_PORT:-4000}:4000"
    volumes:
      - orbitid-data:/data
    read_only: true
    tmpfs:
      # Optional. The image already writes its temporary files under /data; this keeps them off the volume.
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  postgres-data:
  orbitid-data:
