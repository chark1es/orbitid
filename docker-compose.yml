# OrbitID with Postgres. Copy .env.example to .env, set ORBITID_ENCRYPTION_KEY and POSTGRES_PASSWORD,
# then: docker compose up -d
#
# The server container is hardened: it runs as the unprivileged `orbitid` user (uid 10001) from the image,
# with a read-only root filesystem, no Linux capabilities it does not need, and a small writable /tmp.
# There is no data volume: users, settings, signing keys and uploaded avatars/logos all live in Postgres,
# which is what makes several replicas possible (see docker-compose.scale.yml).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbitid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: orbitid
    # Sized for the documented scale example (docker-compose.scale.yml: 3 replicas, or up to 5 with
    # --scale). Total connections = replicas x (ORBITID_DB_MAX_CONNECTIONS + 1 listener for
    # settings NOTIFY), which is 5 x (20 + 1) = 105 here. If you run more replicas, lower the
    # per-replica pool or raise this limit to match.
    command: ["postgres", "-c", "max_connections=300"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitid -d orbitid"]
      interval: 5s
      timeout: 3s
      retries: 10

  orbitid:
    build: .
    # Tag compose builds this checkout as. The smoke test sets it per run so parallel runs stay isolated.
    image: ${ORBITID_IMAGE:-orbitid:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The connection is passed as separate parts, never as a URL: a password containing / + = @ : % or a
      # space would otherwise have to be URL-encoded. Any value works here, `openssl rand -hex 32` included.
      ORBITID_DATABASE_HOST: postgres
      ORBITID_DATABASE_PORT: "5432"
      ORBITID_DATABASE_USER: orbitid
      ORBITID_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      ORBITID_DATABASE_NAME: orbitid
      # The port below is published on the host, so the default public URL follows it. Set ORBITID_BASE_URL
      # explicitly when a proxy or a public hostname reaches this instance, or redirects and tokens point here.
      ORBITID_BASE_URL: ${ORBITID_BASE_URL:-http://localhost:${ORBITID_PORT:-4000}}
      ORBITID_ENCRYPTION_KEY: ${ORBITID_ENCRYPTION_KEY:?Set ORBITID_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      ORBITID_SECRET_KEY: ${ORBITID_SECRET_KEY:-}
      ORBITID_TRUST_PROXY: ${ORBITID_TRUST_PROXY:-0}
      # Postgres pool per replica. Each replica also opens one dedicated LISTEN connection for
      # settings changes, so keep replicas x (ORBITID_DB_MAX_CONNECTIONS + 1) below Postgres's
      # max_connections (300 in this file, sized for the documented 5-replica example). Lower this
      # value when you scale out further instead of raising Postgres alone.
      ORBITID_DB_MAX_CONNECTIONS: ${ORBITID_DB_MAX_CONNECTIONS:-20}
      ORBITID_DB_ACQUIRE_TIMEOUT_MS: ${ORBITID_DB_ACQUIRE_TIMEOUT_MS:-30000}
      ORBITID_RESEND_API_KEY: ${ORBITID_RESEND_API_KEY:-}
      ORBITID_SMTP_URL: ${ORBITID_SMTP_URL:-}
      ORBITID_EMAIL_FROM: ${ORBITID_EMAIL_FROM:-}
      # Release check against GitHub every 6 hours (no instance data sent); false makes no request.
      ORBITID_UPDATE_CHECK: ${ORBITID_UPDATE_CHECK:-true}
    ports:
      - "${ORBITID_PORT:-4000}:4000"
    # The binary probes /ready itself (the database-aware endpoint); no curl or shell
    # is needed in the runtime image.
    healthcheck:
      test: ["CMD", "/usr/local/bin/orbitid", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 5
    # No writable application volume. The image defaults ORBITID_DATA_DIR to /tmp/orbitid, which only
    # holds a boot-time directory (and a legacy key file that Postgres deployments never write). The
    # tmpfs below makes that work under a read-only root filesystem and keeps it off the host.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  postgres-data:
