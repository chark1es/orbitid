<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1512'/%3E%3Cg transform='translate(2.4 2.4) scale(0.85)'%3E%3Cpath d='M25.56 13.08 A10 10 0 1 1 18.92 6.44' fill='none' stroke='%23f9f6f2' stroke-width='2.8' stroke-linecap='round'/%3E%3Ccircle cx='23.07' cy='8.93' r='2.8' fill='%23f9f6f2'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23e5383b'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>OrbitID</title>
    <meta name="description" content="Dashboard for a self-hosted OrbitID instance" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("orbitid-theme");
          const theme = stored === "light" || stored === "dark" ? stored : "system";
          const dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          const root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch {
          /* Storage can be blocked; the system default applies. */
        }
      })();
    </script>
    <script>
      // Ask who is signed in while the app's code is still downloading, so the first screen is the right one.
      (() => {
        try {
          const boot = (window.__ORBITID_BOOT__ = {});
          boot.status = fetch("/v1/operator_sessions/status", { credentials: "same-origin", headers: { Accept: "application/json" } })
            .then((response) => {
              if (!response.ok) throw new Error(`status ${response.status}`);
              return response.json();
            })
            .then((value) => (boot.value = value));
          boot.status.catch(() => {});
        } catch {
          /* The app asks again on its own. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
