<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1512'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23f9f6f2' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23f9f6f2'/%3E%3C/svg%3E"
    />
    <title>OrbitID</title>
    <meta name="description" content="Dashboard for a self-hosted OrbitID instance" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("orbitid-theme");
          const theme = stored === "light" || stored === "dark" ? stored : "system";
          const dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          const root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch {
          /* Storage can be blocked; the system default applies. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
